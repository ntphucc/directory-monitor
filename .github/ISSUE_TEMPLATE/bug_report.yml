name: Bug report
description: Report a reproducible defect in Directory Monitor.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Directory Monitor. Remove credentials, private paths, customer names, and other sensitive data before submitting logs or screenshots.
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: "1.1.8"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Windows Server 2022
        - Windows Server 2025
        - Other supported Windows version
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Installer
        - Portable/self-contained
        - Development build
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only sanitized excerpts. Never include connection strings, passwords, customer data, or encrypted .dm files.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and sensitive customer or machine data.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
