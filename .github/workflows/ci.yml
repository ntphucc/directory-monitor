name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 9, Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore DirectoryMonitor.slnx --locked-mode

      - name: Build
        run: dotnet build DirectoryMonitor.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test DirectoryMonitor.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=directory-monitor-tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
